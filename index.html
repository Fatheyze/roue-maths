<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Roue Tourne – Maths</title>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:'Trebuchet MS',Verdana,sans-serif;color:#fff;min-height:100vh;display:flex;
background:radial-gradient(circle at 60% 40%,#2a0f4a,#14072e 70%);overflow-x:hidden}
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bg span{position:absolute;font-size:40px;color:#ffffff12;font-weight:bold;animation:fl linear infinite}
@keyframes fl{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-20vh) rotate(360deg)}}
aside{width:260px;padding:16px;background:linear-gradient(#2c1650,#1a0b38);border-right:1px solid #ffffff18;z-index:1;flex-shrink:0}
h1{color:#ffc400;font-size:22px;padding-bottom:12px;border-bottom:1px solid #ffffff22;margin-bottom:14px}
.cl{display:block;width:100%;padding:11px;margin-bottom:8px;border-radius:10px;border:1px solid #ffffff30;
background:#3b2763;color:#fff;font-size:15px;cursor:pointer;text-align:left}
.cl:hover{background:#4a3178}.cl.on{background:#ff3fa4;border-color:#ffc400;font-weight:bold}
.cl small{opacity:.7;float:right}
label{display:block;font-size:13px;margin:12px 0 4px;color:#d9c9ff}
select{width:100%;padding:8px;border-radius:8px;background:#3b2763;color:#fff;border:1px solid #ffffff30}
.chk{display:flex;gap:8px;align-items:center;cursor:pointer}
#hist{font-size:12px;color:#c9b8ee;margin-top:14px;line-height:1.6}
main{flex:1;display:flex;align-items:center;justify-content:center;gap:30px;padding:20px;z-index:1;flex-wrap:wrap}
#wrap{position:relative;width:min(78vh,92vw,720px);aspect-ratio:1}
canvas{width:100%;height:100%;display:block;border-radius:50%;box-shadow:0 0 50px #ffc40055}
#ptr{position:absolute;right:-22px;top:50%;margin-top:-18px;width:0;height:0;border-top:18px solid transparent;
border-bottom:18px solid transparent;border-right:34px solid #ff4fa8;filter:drop-shadow(0 0 8px #ff4fa8)}
#hub{position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px;border-radius:50%;
background:radial-gradient(circle at 35% 30%,#ffe27a,#f0a000);border:4px solid #ffffff80;display:flex;
align-items:center;justify-content:center;font-size:34px;color:#7a4a00;font-weight:bold;box-shadow:0 0 18px #000a}
#pick{text-align:center}#pick h2{color:#ffc400;font-size:34px;margin-bottom:24px}
#big{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;max-width:620px}
#big button{width:170px;padding:28px 10px;font-size:34px;font-weight:bold;color:#fff;border:3px solid #ffc400;
border-radius:20px;background:linear-gradient(#ff49a8,#c4106e);cursor:pointer;box-shadow:0 8px 30px #ff49a844}
#big button:hover{transform:scale(1.07)}#big small{display:block;font-size:14px;font-weight:normal;opacity:.85;margin-top:6px}
#go{padding:18px 44px;font-size:26px;font-weight:bold;color:#fff;border:0;border-radius:50px;cursor:pointer;
background:linear-gradient(#ff49a8,#c4106e);box-shadow:0 8px 30px #ff49a855}
#go:hover{transform:scale(1.05)}#go:disabled{opacity:.5;cursor:wait}
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
#card{background:linear-gradient(#3a1d6e,#1d0c42);border:3px solid #ffc400;border-radius:24px;padding:28px;
max-width:560px;width:100%;text-align:center;box-shadow:0 0 60px #ffc40066;animation:pop .4s}
@keyframes pop{from{transform:scale(.5);opacity:0}}
#nm{font-size:30px;color:#ffc400;font-weight:bold}
#tag{margin:6px 0 14px;color:#ff8ad0}
#q{font-size:30px;margin:14px 0;min-height:80px;display:flex;align-items:center;justify-content:center;line-height:1.3}
#a{font-size:28px;color:#6dffb0;min-height:38px;font-weight:bold}
#bar{height:10px;background:#ffffff22;border-radius:6px;overflow:hidden;margin:10px 0}
#bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#6dffb0,#ffc400,#ff3f6e)}
.b{padding:10px 18px;margin:6px 4px 0;border-radius:20px;border:0;font-size:15px;cursor:pointer;background:#ffffff25;color:#fff}
.b:hover{background:#ffffff45}.b.p{background:#ff3fa4}
@media(max-width:800px){body{flex-direction:column}aside{width:100%;border:0}.cl{display:inline-block;width:auto}}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<aside>
  <h1>🎡 La Roue Tourne</h1>
  <div id="cls"></div>
  <label>Niveau des défis maths</label>
  <select id="lvl"><option value="auto">Auto (selon la classe)</option><option value="6">6ème</option><option value="3">3ème</option></select>
  <label class="chk"><input type="checkbox" id="rm" checked> Retirer l'élève déjà tiré</label>
  <label class="chk"><input type="checkbox" id="mq" checked> Poser un défi de maths</label>
  <button class="b" id="rst" style="margin-top:12px">↺ Remettre tout le monde</button>
  <div id="hist"></div>
</aside>
<main>
  <div id="pick"><h2>Choisis ta classe 👇</h2><div id="big"></div></div>
  <div id="game" style="display:none;align-items:center;justify-content:center;gap:30px;flex-wrap:wrap">
    <div id="wrap"><canvas id="c" width="900" height="900"></canvas><div id="ptr"></div><div id="hub">π</div></div>
    <button id="go">🎰 Tourner !</button>
  </div>
</main>
<div id="modal"><div id="card">
  <div id="nm"></div><div id="tag"></div>
  <div id="bar"><i id="fill"></i></div>
  <div id="q"></div><div id="a"></div>
  <button class="b p" id="rev">👀 Voir la réponse</button>
  <button class="b" id="nxt">🔄 Autre défi</button>
  <button class="b" id="cls2">✖ Fermer</button>
</div></div>

<script>
/* ====== LISTES DES CLASSES (modifie ici si besoin) ====== */
const CLASSES={
"6B":["AÏT-ADDI Yanis","AMROUCHE Nelya","BEKRAOUI Rayan","BELKENICHE Neyla","BENSAKROUTE Sultan","CABIT Lukas","DELACOUR Térence","DIVAIS Valentino","GUILBERT Kurtis","LETOURNEUR COLOMBO Tahis","MADELEINE Maxime","MONTEIL Hugo","N'DIAYE Hind","OUHHABI Kais","PARIS FLEURY Maelys","RANTY Lola","RAZAFINDRAIBE Jessley","RIH Mohamed-Iram","SAVARY Rachel","SCHELTIENNE Talya","SOHAHI Gabriel","SOUANEF Sawsene","TALLA Sumayyah","TOUATI Cyrine","WADE Ismaël"],
"6C":["AFONSO-NOVO Sofia","ALAOUCHICHE Bastien","ANGEBERT Valentin","BARRA ULAS Alice","BONNEAU Steven","BROCQUET Shana","CERVAIN Mathis","CHELLALA Selyan","DENBEKLI Louka","DIALLO Farah","DOUKOURÉ Ilyana","FRAPART Méline","HAN Delila","LE BLANC COFFARD Angele","MIGNAULT Jules","MOKHFI Noham","MZIMBA Yasmine","NIANG Shaad-Fatima","RENOLDE Glenn","ROBERT Eïleen","SY Dyor","SY Ountina","TURCAN JELEZNIAKOV Anton"],
"6D":["ANGEBERT Sacha","BATAILLE Joseph","BELHOUSSAINE Safir","BIHACHE Sasha","CHERITAT Hugo","CISSOKO Souleymane","COULIBALY Soumeya","CUNY GOULAY Chloe","DA COSTA Jaden","EL KHATTABI Salma","GAUDE Selena","ISARD Joshua","KILIC Nisa","KUVA EPOMA Evans","MANDZEKI NTANGUI Marc","MAVOUNGOU Kim Kelly","MENDY Angelique","THIBERVILLE Cloe","THIMBO Salamata","THOMAS Shaïnyss","VRIGNAUD Nayce","WAMPACH Lizie","WOUENZELL Rayven","ZEKIC Anabella"],
"6E":["BERKAL Nacer","BERTE Irma","BIALEK Ryan","BOUGOSSE Kéo","BOURAK Amine","CARLUS Eloim","CORNET THÉBAUD Élina","COULIBALY Mariam","DEBRAY Mariam","DUFOUR JOURDIN Elisa","HRINCESCU Eduard","ID BELHAJ Janaâ","ISARD Stacy","KANTE Aaliyah","KESSACI Ines","MENDES Kimya","MONCEAUX MINGUET Camille","MOREL Talyana","PIRON Mélina","SAHRANE Issam","THERESINE Maelan","WASSA NTAFA Jules David"],
"3F":["ADY Vivaan","ANDRE MARTIN Louise","ARIS Ashley","BABY LHORTIE Enzo","BONDAREVSKY Mélyna","BOUDIAF LEDUC Pharrell","BOUDJEMIL Nelia","BRETONNIERE Camille","CHAHRANE Rami","CHAPRON Eden","COCYUK Dildar","DECIMUS Eden","EL KHATTABI Naoufel","GERMANY Odeliah","HERMAN Hugo","KINZENI NOTI Kevin","LETENDRE Swan","MADOURI KAHN Lina","MAYA Yohan","MOREL Mallory","MOUNIE Angele","MURBACH JAULINO TABOSA Gabriel","NDAW Thierno-Bassirou","PETRICCIUOLO Eugenio","PRINCE COUDAN Morgane","RASELINANTOANDRO Noah","SY Kalye","TSHIBUABUA MUTOMBO Yannis Sam"]
};

/* ====== DÉFIS MATHS ====== */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)), P=a=>a[R(0,a.length-1)];
const gcd=(a,b)=>b?gcd(b,a%b):a;
const M6=[
()=>{const a=R(3,12),b=R(3,12);return[`${a} × ${b} = ?`,a*b]},
()=>{const a=R(2,9),b=R(2,9),c=R(2,9);return[`${a} + ${b} × ${c} = ?`,a+b*c]},
()=>{const a=R(2,9),b=R(2,9),c=R(2,9);return[`(${a} + ${b}) × ${c} = ?`,(a+b)*c]},
()=>{const p=P([10,20,25,50]),n=P([40,60,80,120,200]);return[`${p} % de ${n} = ?`,p*n/100]},
()=>{const d=R(3,9),q=R(5,12),r=R(1,d-1);return[`Reste de la division de ${d*q+r} par ${d} ?`,r]},
()=>{const n=P([2,3,5,6,9,10,4]),m=R(11,19)*n;return[`Combien de fois ${n} dans ${m} ?`,m/n]},
()=>{const L=R(4,15),l=R(2,L-1);return[`Périmètre d'un rectangle de ${L} cm sur ${l} cm ?`,2*(L+l)+" cm"]},
()=>{const L=R(3,12),l=R(2,9);return[`Aire d'un rectangle de ${L} cm sur ${l} cm ?`,L*l+" cm²"]},
()=>{const d=P([2,4,8]),a=R(1,d-1),b=R(1,d-a);const n=a+b,g=gcd(n,d);return[`${a}/${d} + ${b}/${d} = ? (simplifie)`,g==d?n/g:`${n/g}/${d/g}`]},
()=>{const n=P([11,13,15,17,19,21,23,27,29,31,33]);const pr=[11,13,17,19,23,29,31].includes(n);return[`${n} est-il un nombre premier ?`,pr?"Oui ✅":"Non ❌"]},
()=>{const a=R(2,9);return[`Le double de ${a*7} puis la moitié de ${a*10}, additionne !`,a*14+a*5]},
()=>{const a=R(12,99),b=R(12,99);return[`${a} + ${b} = ?`,a+b]}
];
const M3=[
()=>{const a=R(11,20);return[`${a}² = ?`,a*a]},
()=>{const a=R(3,9);return[`√${a*a*(a>4?4:1)} = ?`,a*(a>4?2:1)]},
()=>{const b=R(2,9);return[`2^${R(4,10)} = ?`,0]},
()=>{const a=R(2,9),x=R(2,9),b=R(1,15);return[`Résous : ${a}x + ${b} = ${a*x+b}`,"x = "+x]},
()=>{const t=P([[3,4,5],[5,12,13],[6,8,10],[8,15,17],[9,12,15]]);return[`Triangle rectangle de côtés ${t[0]} et ${t[1]} : hypoténuse ?`,t[2]]},
()=>{const a=R(1,6),b=R(1,6);return[`Développe : (x + ${a})(x + ${b})`,`x² + ${a+b}x + ${a*b}`]},
()=>{const p=P([10,20,25,50]),n=P([40,80,120,200]);return[`${n} augmenté de ${p} % = ?`,n*(1+p/100)]},
()=>{const a=R(2,5),b=R(2,5);return[`Écriture scientifique de ${a*1000+b*100} ?`,`${(a+b/10)} × 10³`]},
()=>{const a=R(2,9),b=R(2,9);return[`Calcule : (-${a}) × (-${b}) − ${a}`,a*b-a]},
()=>{const n=R(2,6);return[`Une urne a ${n} boules rouges et ${n*2} bleues : P(rouge) ?`,"1/3"]},
()=>{const a=R(2,9),b=R(2,9);return[`Factorise : ${a*b}x + ${a*R(2,5)*0+a}`,`${a}(${b}x + 1)`]}
];
// défi "2^n" corrigé
M3[2]=()=>{const n=R(4,10);return[`2^${n} = ?`,2**n]};
M3[10]=()=>{const a=R(2,6),b=R(2,6);return[`Factorise : ${a*b}x + ${a*3}`,`${a}(${b}x + 3)`]};

/* ====== ÉTAT & ROUE ====== */
const COLORS=["#ff0070","#84b817","#c77dff","#0077b6","#e63946","#f4a261","#2a9d8f","#457b9d","#e9c46a","#8338ec","#06d6a0","#fb5607","#3a86ff"];
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),S=900,C=S/2,RAD=C-26;
let cur=null,pool=[],used=[],rot=0,spinning=false,tm;
const $=id=>document.getElementById(id);

function buildTabs(){
  $('cls').innerHTML="";$('big').innerHTML="";
  Object.keys(CLASSES).forEach(k=>{
    const B=document.createElement('button');B.innerHTML=`${k}<small>${CLASSES[k].length} élèves</small>`;
    B.onclick=()=>{cur=k;reset();buildTabs()};$('big').appendChild(B);
    const b=document.createElement('button');b.className='cl'+(k==cur?' on':'');
    b.innerHTML=`${k.startsWith('3')?'🧮':'📐'} ${k} <small>${CLASSES[k].length}</small>`;
    b.onclick=()=>{if(!spinning){cur=k;reset();buildTabs()}};$('cls').appendChild(b);
  });
}
function reset(){
  $('pick').style.display=cur?"none":"block";$('game').style.display=cur?"flex":"none";
  if(!cur)return;
  pool=[...CLASSES[cur]];used=[];hist();draw()}
function hist(){$('hist').innerHTML=used.length?"<b>Déjà passés :</b><br>"+used.map(u=>"✔ "+u).join("<br>"):""}
function draw(){
  ctx.clearRect(0,0,S,S);
  // bord doré
  ctx.beginPath();ctx.arc(C,C,C-4,0,7);ctx.fillStyle="#f5b800";ctx.fill();
  const n=pool.length;
  if(!n){ctx.fillStyle="#2a0f4a";ctx.beginPath();ctx.arc(C,C,RAD,0,7);ctx.fill();ctx.fillStyle="#ffc400";
    ctx.font="bold 34px Trebuchet MS";ctx.textAlign="center";ctx.fillText("Tout le monde est passé 🎉",C,C+80);return}
  const a=2*Math.PI/n;
  for(let i=0;i<n;i++){
    const s=rot+i*a;
    ctx.beginPath();ctx.moveTo(C,C);ctx.arc(C,C,RAD,s,s+a);ctx.closePath();
    ctx.fillStyle=COLORS[i%COLORS.length];if(n%COLORS.length==1&&i==n-1)ctx.fillStyle="#ffd166";
    ctx.fill();ctx.strokeStyle="#ffffff55";ctx.lineWidth=1.5;ctx.stroke();
    ctx.save();ctx.translate(C,C);ctx.rotate(s+a/2);ctx.textAlign="right";ctx.textBaseline="middle";
    ctx.fillStyle="#12082a";let fs=Math.min(26,a*RAD*.42);const t=pool[i],maxW=RAD-95;
    ctx.font=`600 ${fs}px Trebuchet MS`;const w=ctx.measureText(t).width;if(w>maxW)fs*=maxW/w;
    ctx.font=`600 ${fs}px Trebuchet MS`;ctx.fillText(t,RAD-18,0);ctx.restore();
  }
}
function spin(){
  if(spinning||!pool.length)return;spinning=true;$('go').disabled=true;
  const n=pool.length,a=2*Math.PI/n,target=Math.random()*2*Math.PI;
  const total=(6+Math.random()*3)*2*Math.PI+target,start=rot,dur=5200,t0=performance.now();
  (function f(now){
    const t=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-t,4);
    rot=start-total*e;draw();
    if(t<1)requestAnimationFrame(f);else{
      const ang=((-rot)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);
      end(Math.floor(ang/a)%n);
    }
  })(t0);
}
function end(i){
  const name=pool[i];spinning=false;$('go').disabled=false;
  if($('mq').checked)showCard(name);
  if($('rm').checked){pool.splice(i,1);used.push(name);hist();}
  setTimeout(draw,0);
}

/* ====== CARTE DÉFI ====== */
let ans="";
function level(){const v=$('lvl').value;return v=='auto'?(cur.startsWith('3')?3:6):+v}
function question(){
  const [q,a]=P(level()==3?M3:M6)();
  $('q').textContent=q;ans=a;$('a').textContent="";$('rev').style.display="";
  clearInterval(tm);const f=$('fill');f.style.transition="none";f.style.width="100%";
  setTimeout(()=>{f.style.transition="width 30s linear";f.style.width="0"},50);
}
function showCard(name){
  $('nm').textContent="🎯 "+name;$('tag').textContent=P(["Défi maths : 30 secondes !","Cerveau en feu 🔥","À toi de jouer, mathématicien·ne !","π est avec toi 🍀"]);
  $('modal').style.display="flex";question();
}
$('rev').onclick=()=>{$('a').textContent="✅ "+ans;$('rev').style.display="none"};
$('nxt').onclick=question;
$('cls2').onclick=()=>$('modal').style.display="none";
$('go').onclick=spin;$('rst').onclick=reset;

/* fond mathématique animé */
"π ∑ √ ∞ ² ÷ × + − = % ∫ Δ ≠ ∠ 7 42".split(" ").forEach((s,i)=>{
  const e=document.createElement('span');e.textContent=s;e.style.left=R(0,95)+"%";
  e.style.animationDuration=R(18,40)+"s";e.style.animationDelay=-R(0,30)+"s";e.style.fontSize=R(24,70)+"px";$('bg').appendChild(e)});
buildTabs();reset();
</script>
</body>
</html>
